[project]
name = "lg-yt-thumbnail-rf-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.24",
    "openai>=3.57.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tavily-python>=0.8.5",
]

[project.scripts]
thumbnail_agent = "thumbnail_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0","hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thumbnail_agent"]

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
]
